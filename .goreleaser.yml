version: 2

project_name: ghemails

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: ghemails
    main: .
    binary: ghemails
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - >-
        -s -w
        -X github.com/codejavu-llc/ghemails/internal/app.Version={{.Version}}
        -X github.com/codejavu-llc/ghemails/internal/app.Commit={{.Commit}}
        -X github.com/codejavu-llc/ghemails/internal/app.Date={{.Date}}

archives:
  - id: release
    ids: [ghemails]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - SECURITY.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  prerelease: auto
